name: Verse of the day

on:
  schedule:
    - cron: "5 4 * * *"   # 04:05 UTC = 00:05 Toronto (EDT), 23:05 prev day in EST; adjust if you care
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verse-of-the-day
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Fetch verse
        env:
          QF_ENV: ${{ vars.QF_ENV || 'prelive' }}
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
          QF_TRANSLATION_MATCH: ${{ vars.QF_TRANSLATION_MATCH }}
          QF_TRANSLATION_FALLBACK: ${{ vars.QF_TRANSLATION_FALLBACK }}
          START_INDEX: ${{ vars.START_INDEX }}
        run: python scripts/fetch_verse.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verse.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "verse: $(date -u +%F)"
          git push
